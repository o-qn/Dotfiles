# Fallback palette/layout from the original setup; desktop sync replaces this.

[appearance]
scheme = "Synced"
theme_mode = "dark"
font_family = "Noto Sans"
corner_radius_scale = 1.0

[appearance.palette]
primary = "#7aa2f7"
on_primary = "#1a1b26"
secondary = "#bb9af7"
on_secondary = "#1a1b26"
tertiary = "#7dcfff"
on_tertiary = "#1a1b26"
error = "#f7768e"
on_error = "#1a1b26"
surface = "#1a1b26"
on_surface = "#c0caf5"
surface_variant = "#24283b"
on_surface_variant = "#a9b1d6"
outline = "#414868"
shadow = "#16161e"
hover = "#33467c"
on_hover = "#c0caf5"

[output]
layout = "DP-2:0,0; DP-3:-1080,-384"
transforms = "DP-2:normal; DP-3:90"
scales = "DP-2:1.25; DP-3:1"
