# Login screen fallback; desktop appearance sync supplies the theme.
[session]
# Leave default unset so noctalia-greeter uses [session].last from /var/lib/noctalia-greeter/sync.toml
# default = "Hyprland"

[user]
default = "qn"

[appearance]
password_style = "default"
hide_logo = true
scheme_selector_position = "hidden"
power_buttons_position = "bottom-right"

[idle]
timeout = 300

[keyboard]
layout = "us,ara"
options = "grp:win_space_toggle"
numlock = true

[cursor]
theme = "default"
size = 24
path = "/usr/share/icons"
