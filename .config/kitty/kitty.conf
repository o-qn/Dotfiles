# Sunset Frosted Glass Theme for Kitty
# font_family      FantasqueSansM Nerd Font
# bold_font        auto
# italic_font      auto
# bold_italic_font auto
font_size        11

# Frosted Glass Transparency & Blur
background_opacity         0.72
background_blur            1
dynamic_background_opacity yes

# Window Layout & UX
window_padding_width    12
confirm_os_window_close 0
enable_audio_bell       no
visual_bell_duration    0.0
scrollback_lines        10000
cursor_shape            beam
cursor_blink_interval   0
url_style               single
allow_remote_control    no

# Powerline Slanted Tab Bar
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_edge            bottom
tab_title_template      {index}: {title}
active_tab_font_style   bold
inactive_tab_font_style normal

# Keybindings
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd

# Sunset Frosted Glass Palette for Kitty (Noctalia-compatible)
background            #111c26
foreground            #f4ece6
cursor                #f27d42
cursor_text_color     #111c26
selection_background  #e06c34
selection_foreground  #fffaf6
url_color             #ff9e5e

active_border_color   #f27d42
inactive_border_color #1f3142
bell_border_color     #e85d4a

active_tab_background   #f27d42
active_tab_foreground   #111c26
inactive_tab_background #172532
inactive_tab_foreground #9aa8b4
tab_bar_background      #0d161e

# Black (Twilight Slate)
color0  #14202c
color8  #4a6073

# Red (Sunset Coral / Crimson)
color1  #e85d4a
color9  #ff7a66

# Green (Forest Pine Moss)
color2  #68c488
color10 #85dca3

# Yellow (Sunset Gold / Ray)
color3  #f5a65b
color11 #ffc07d

# Blue (Dusk Sky Teal-Blue)
color4  #589ec9
color12 #7abbe3

# Magenta (Twilight Violet-Rose)
color5  #c97bb2
color13 #e099cb

# Cyan (Horizon Mist)
color6  #5fb8b8
color14 #7fd4d4

# White (Warm Sunset Cream)
color7  #e3d8cf
color15 #fffaf6

include themes/noctalia.conf


# BEGIN_KITTY_FONTS
font_family      family='FiraCode Nerd Font' postscript_name=FiraCodeNF-Reg
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
