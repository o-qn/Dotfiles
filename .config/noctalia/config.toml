# Desktop preferences; install.py expands the portable paths.
[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.68000000000000005
    border = "outline"
    border_width = 1
    center = [ "clock" ]
    concave_edge_corners = false
    end = [ "tray", "keyboard_layout", "network", "media", "volume", "notifications", "bluetooth", "control-center" ]
    margin_edge = 8
    margin_ends = 10
    margin_opposite_edge = 0
    padding = 12
    position = "top"
    radius = 12
    radius_bottom_left = 12
    radius_bottom_right = 12
    radius_top_left = 12
    radius_top_right = 12
    reserve_space = true
    shadow = true
    start = [ "launcher", "workspaces", "workspace-add-main" ]
    thickness = 38
    widget_spacing = 8

        [bar.default.monitor.secondary]
        center = [ "clock" ]
        end = [ "keyboard_layout", "volume", "notifications", "control-center" ]
        match = "Sceptre L24"
        start = [ "launcher", "workspaces", "workspace-add-portrait" ]

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
enabled = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 2700.0

    [idle.behavior.lock-and-suspend]
    enabled = false
    timeout = 0.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 1800.0

[location]
address = "Amman,Jordan"

[lockscreen]
enabled = true
lock_before_suspend = true
transition = [ "fade" ]
transition_duration = 250

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-3", "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1024.0
    cy = 1006.4000244140625
    output = "DP-2"
    placement_height = 1152.0
    placement_width = 2048.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 810.0
    cx = 540.0
    cy = 1596.4444580078125
    output = "DP-3"
    placement_height = 1920.0
    placement_width = 1080.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.78000000000000003
history_retention_hours = 24
max_visible = 4
offset_y = 12
position = "top_right"

[osd]
background_opacity = 0.71999999999999997
position = "bottom_center"

[shell]
clipboard_enabled = true
clipboard_history_max_entries = 150
font_family = "Noto Sans"
polkit_agent = true
setup_wizard_enabled = false
time_format = "{:%-I:%M %p}"

    [shell.animation]
    enabled = true
    speed = 1.1499999999999999

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    app_grid = false
    pinned = [ "kitty", "zen-browser", "pcmanfm-qt" ]
    sort_by_usage = true

    [shell.panel]
    clipboard_placement = "floating"
    clipboard_position = "center"
    launcher_placement = "floating"
    launcher_position = "center"
    transparency_mode = "glass"

    [shell.screenshot]
    annotate = true
    copy_to_clipboard = true
    directory = "@HOME@/Pictures/Screenshots"
    freeze_screen = true
    save_to_file = true
    show_cursor = false

[theme]
builtin = "Nord"
community_palette = "Rosey AMOLED"
custom_palette = "TokyoNight"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-fruit-salad"

    [theme.templates]
    builtin_ids = [ "kitty", "gtk3", "gtk4", "qt", "kcolorscheme", "btop" ]
    enable_builtin_templates = true
    enable_community_templates = false

        [theme.templates.user.hyprland-accent]
        hook_async = false
        input_path = "templates/hyprland/colors.lua"
        output_path = "$XDG_CONFIG_HOME/hypr/noctalia.lua"
        post_hook = "hyprctl reload"

[wallpaper]
directory = "@DATA_HOME@/wallpapers"
enabled = true
fill_mode = "crop"
transition = [ "fade" ]
transition_duration = 400

    [wallpaper.default]
    path = "@DATA_HOME@/wallpapers/abstract-swirls.jpg"

    [wallpaper.last]
    path = "@DATA_HOME@/wallpapers/abstract-swirls.jpg"

    [wallpaper.monitors.DP-2]
    path = "@DATA_HOME@/wallpapers/abstract-swirls.jpg"

    [wallpaper.monitors.DP-3]
    path = "@DATA_HOME@/wallpapers/abstract-swirls.jpg"

[widget.clock]
format = "{:%a %d %b · %-I:%M %p}"
timezone = "Asia/Amman"
tooltip_format = "{:%A, %B %d, %Y}"

[widget.keyboard_layout]
display = "short"
show_glyph = false
show_label = true

[widget.media]
max_length = 190

[widget.network]
enabled = false

[widget.workspace-add-main]
color = "primary"
glyph = "plus"
tooltip = "New workspace on the main monitor"
type = "custom_button"

    [widget.workspace-add-main.actions]
    left = "exec python3 \"${XDG_CONFIG_HOME:-$HOME/.config}/hypr/scripts/workspace.py\" new --monitor G2721P"

[widget.workspace-add-portrait]
color = "primary"
glyph = "plus"
tooltip = "New workspace on the portrait monitor"
type = "custom_button"

    [widget.workspace-add-portrait.actions]
    left = "exec python3 \"${XDG_CONFIG_HOME:-$HOME/.config}/hypr/scripts/workspace.py\" new --monitor Sceptre"

[widget.workspaces]
active_pill_size = 1.3
empty_color = "surface_variant"
focused_color = "primary"
hide_when_empty = false
label_source = "id"
occupied_color = "secondary"
show_all_outputs = false
show_labels = true
style = "regular"

# Zen reads these stylesheets at startup. Restart it after a palette change.
[theme.templates.user.zen-browser-chrome]
input_path = "templates/zen-browser/zen-userChrome.css"
output_path = "$XDG_CACHE_HOME/noctalia/zen-browser/zen-userChrome.css"
post_hook = "python3 '{{ config_dir }}/templates/zen-browser/apply.py'"
hook_async = false

[theme.templates.user.zen-browser-content]
input_path = "templates/zen-browser/zen-userContent.css"
output_path = "$XDG_CACHE_HOME/noctalia/zen-browser/zen-userContent.css"
post_hook = "python3 '{{ config_dir }}/templates/zen-browser/apply.py'"
hook_async = false
