# Tokyo Night. GUI preferences have been folded into this portable base.
# install.py expands @HOME@, @CONFIG_HOME@ and @DATA_HOME@.

[theme]
mode = "dark"
source = "custom"
custom_palette = "TokyoNight"
builtin = "Eldritch"
community_palette = "Kemuri"
wallpaper_scheme = "faithful"

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["kitty", "gtk3", "gtk4", "qt", "kcolorscheme", "btop"]
enable_community_templates = false

[theme.templates.user]

[theme.templates.user.cosmic]
input_path = "templates/cosmic/palette.json"
output_path = "$XDG_CACHE_HOME/noctalia/cosmic-palette.json"
post_hook = "python3 '{{ config_dir }}/templates/cosmic/apply.py' \"${XDG_CACHE_HOME:-$HOME/.cache}/noctalia/cosmic-palette.json\""
hook_async = false

[shell]
font_family = "Noto Sans"
polkit_agent = true
clipboard_enabled = true
clipboard_history_max_entries = 150
setup_wizard_enabled = false
time_format = "{:%-I:%M %p}"

[shell.animation]
enabled = true
speed = 1.15

[shell.launcher]
app_grid = false
sort_by_usage = true
pinned = ["kitty", "zen-browser", "com.system76.CosmicFiles"]

[shell.panel]
transparency_mode = "glass"
launcher_placement = "floating"
launcher_position = "center"
clipboard_placement = "floating"
clipboard_position = "center"

[shell.screenshot]
annotate = true
copy_to_clipboard = true
save_to_file = true
directory = "@HOME@/Pictures/Screenshots"
freeze_screen = true
show_cursor = false

[shell.greeter_sync]
auto_sync = true

[bar]
order = ["default"]

[bar.default]
position = "top"
thickness = 38
margin_edge = 8
margin_ends = 10
margin_opposite_edge = 0
radius = 12
radius_top_left = 12
radius_top_right = 12
radius_bottom_left = 12
radius_bottom_right = 12
concave_edge_corners = false
background_opacity = 0.68
border = "outline"
border_width = 1
shadow = true
reserve_space = true
padding = 12
widget_spacing = 8
start = ["launcher", "workspaces", "workspace-add-main"]
center = ["clock"]
end = ["tray", "keyboard_layout", "network", "media", "volume", "notifications", "bluetooth", "control-center"]

[bar.default.monitor]

[bar.default.monitor.secondary]
match = "Sceptre L24"
start = ["launcher", "workspaces", "workspace-add-portrait"]
center = ["clock"]
end = ["keyboard_layout", "volume", "notifications", "control-center"]

[widget]

[widget.workspaces]
style = "regular"
show_labels = true
label_source = "id"
show_all_outputs = false
hide_when_empty = false
active_pill_size = 1.3
focused_color = "primary"
occupied_color = "secondary"
empty_color = "surface_variant"

[widget.workspace-add-main]
type = "custom_button"
glyph = "plus"
color = "primary"
tooltip = "New workspace on the main monitor"

[widget.workspace-add-main.actions]
left = "exec python3 \"${XDG_CONFIG_HOME:-$HOME/.config}/hypr/scripts/workspace.py\" new --monitor DP-2"

[widget.workspace-add-portrait]
type = "custom_button"
glyph = "plus"
color = "primary"
tooltip = "New workspace on the portrait monitor"

[widget.workspace-add-portrait.actions]
left = "exec python3 \"${XDG_CONFIG_HOME:-$HOME/.config}/hypr/scripts/workspace.py\" new --monitor DP-3"

[widget.clock]
timezone = "Asia/Amman"
format = "{:%a %d %b · %-I:%M %p}"
tooltip_format = "{:%A, %B %d, %Y}"

[widget.keyboard_layout]
show_glyph = false
show_label = true
display = "short"

[widget.media]
max_length = 190

[widget.network]
enabled = false

[dock]
enabled = false

[notification]
position = "top_right"
background_opacity = 0.78
max_visible = 4
history_retention_hours = 24
offset_y = 12

[osd]
position = "bottom_center"
background_opacity = 0.72

[idle]
behavior_order = ["lock", "screen-off", "lock-and-suspend"]

[idle.behavior]

[idle.behavior.lock]
enabled = true
action = "lock"
timeout = 2700.0

[idle.behavior.screen-off]
enabled = true
action = "screen_off"
timeout = 1800.0

[idle.behavior.lock-and-suspend]
enabled = false
timeout = 0.0

[lockscreen]
enabled = true
lock_before_suspend = true
transition = ["fade"]
transition_duration = 250

[wallpaper]
enabled = true
directory = "@DATA_HOME@/wallpapers"
fill_mode = "crop"
transition = ["fade"]
transition_duration = 400

[wallpaper.default]
path = "@DATA_HOME@/wallpapers/abstract-swirls.jpg"

[wallpaper.monitors]

[wallpaper.monitors.DP-2]
path = "@DATA_HOME@/wallpapers/abstract-swirls.jpg"

[wallpaper.monitors.DP-3]
path = "@DATA_HOME@/wallpapers/abstract-swirls.jpg"

[desktop_widgets]
schema_version = 2
widget_order = []

[desktop_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[desktop_widgets.widget]

[location]
address = "Amman,Jordan"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = ["lockscreen-login-box@DP-3", "lockscreen-login-box@DP-2"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget]

[lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
box_height = 196.0
box_width = 810.0
cx = 1024.0
cy = 1006.4000244140625
output = "DP-2"
placement_height = 1152.0
placement_width = 2048.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
box_height = 196.0
box_width = 810.0
cx = 540.0
cy = 1596.4444580078125
output = "DP-3"
placement_height = 1920.0
placement_width = 1080.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
