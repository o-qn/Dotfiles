config_version = 15

[bar.default]
center = [ "clock", "cat", "volume" ]
end = [ "tray", "keyboard_layout", "network", "media", "notifications", "bluetooth", "control-center" ]
start = [ "launcher", "workspaces", "workspace-add-main", "active_window", "layout-main" ]

    [bar.default.monitor."Sceptre L24"]
    end = [ "tray", "keyboard_layout", "network", "notifications", "bluetooth", "control-center" ]
    start = [ "launcher", "workspaces", "workspace-add-portrait", "active_window", "layout-portrait" ]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [
    "lockscreen-login-box@WAYLAND-1",
    "lockscreen-login-box@WL-1",
    "lockscreen-login-box@DP-3",
    "lockscreen-login-box@DP-2"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 1024.0
    cy = 970.0
    output = "DP-2"
    placement_height = 1152.0
    placement_width = 2048.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
