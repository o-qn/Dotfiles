[plugins]
enabled = [
    "noctalia/wallhaven",
    "noctalia/mpvpaper",
    "noctalia/bongocat",
    "noctalia/bitwarden",
    "desktop/displays",
    "desktop/umbriel-layout"
]

[theme]
builtin = "Dracula"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "dysfunctional"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "mango", "niri", "qt", "umbriel" ]
    community_ids = [ "opencode", "papirus-icons", "fzf" ]
    enable_community_templates = true

