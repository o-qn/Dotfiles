id = "desktop/umbriel-layout"
name = "Umbriel Controls"
version = "2.0.0"
plugin_api = 9
author = "qn"
license = "MIT"
icon = "layout-board-split"
description = "Per-workspace layout indicators, submap/scratchpad/cast status pill, and dual-monitor Control Center for Umbriel."
dependencies = ["umbriel", "python3"]

[[widget]]
id = "layout"
entry = "layout.luau"

  [[widget.setting]]
  key = "output"
  type = "string"
  label_key = "settings.output.label"
  default = "main"

[[widget]]
id = "ws1"
entry = "ws1.luau"

  [[widget.setting]]
  key = "output"
  type = "string"
  label_key = "settings.output.label"
  default = "main"

[[widget]]
id = "status"
entry = "status.luau"

[[shortcut]]
id = "shortcut"
entry = "shortcut.luau"

[[panel]]
id = "controls"
entry = "panel.luau"
width = 580
height = 740
placement = "attached"
position = "auto"
