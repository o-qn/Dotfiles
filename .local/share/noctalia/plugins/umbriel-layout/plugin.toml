id = "desktop/umbriel-layout"
name = "Umbriel Controls"
version = "1.0.0"
plugin_api = 9
author = "qn"
license = "MIT"
icon = "layout-board-split"
description = "Per-workspace layout indicators and Control Center panel for Umbriel."
dependencies = ["umbriel", "python3"]

[[widget]]
id = "main"
entry = "main.luau"

[[widget]]
id = "portrait"
entry = "portrait.luau"

[[widget]]
id = "ws1"
entry = "ws1.luau"

  [[widget.setting]]
  key = "output"
  type = "string"
  label_key = "settings.output.label"
  default = "DP-2"

[[shortcut]]
id = "shortcut"
entry = "shortcut.luau"

[[panel]]
id = "controls"
entry = "panel.luau"
width = 560
height = 680
placement = "attached"
position = "auto"
